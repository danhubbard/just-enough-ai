<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>just enough ai | Practical AI for small businesses</title>
  <meta name="description" content="We help small businesses find the specific bit of AI that will actually make a difference-then make it happen.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:     #F5F3EE;
      --fg:     #111111;
      --muted:  #787670;
      --accent: #2C4A3E;
      --rule:   #D6D2CA;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Nav ─────────────────────────────────────────────── */

    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 36px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-logo em {
      font-style: italic;
      color: var(--accent);
    }

    .nav-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: var(--fg);
    }

    /* ─── Hero ────────────────────────────────────────────── */

    .hero {
      height: 100vh;
      min-height: 600px;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 52px;
    }

    .hero-headline {
      display: flex;
      align-items: flex-end;
    }

    .hero-headline h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3.2rem, 7vw, 6.4rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.025em;
      max-width: 16ch;
    }

    .hero-headline h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-foot {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--rule);
      margin-top: 28px;
    }

    .hero-desc {
      font-size: 16px;
      color: var(--muted);
      max-width: 40ch;
      line-height: 1.7;
    }

    .hero-action {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: var(--fg);
      color: var(--bg);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent);
    }

    .hero-action-sub {
      font-size: 12px;
      color: var(--rule);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ─── Responsive ──────────────────────────────────────── */

    @media (max-width: 680px) {
      .nav {
        padding: 24px 28px;
      }

      .hero {
        padding: 28px;
        padding-top: 80px;
      }

      .hero-foot {
        flex-direction: column;
        gap: 28px;
      }

      .hero-action {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="#" class="nav-logo">just enough <em>ai</em></a>
    <a href="#contact" class="nav-link">Let's talk</a>
  </nav>

  <section class="hero">
    <div class="hero-headline">
      <h1>You know you should be doing something with AI. <em>A little could help a lot.</em></h1>
    </div>
    <div class="hero-foot">
      <p class="hero-desc">We help small businesses find the specific bit of AI that'll actually make a difference-then we make it happen.</p>
      <div class="hero-action">
        <a href="#contact" class="btn">Book a discovery call</a>
        <span class="hero-action-sub">Free, 30 minutes, no pitch</span>
      </div>
    </div>
  </section>

</body>
</html>
