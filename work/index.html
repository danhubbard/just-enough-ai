{% assign first_case_study = site.work | sort: "order" | first %}
{% assign target = first_case_study.url | default: "/" | relative_url %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="{{ target | absolute_url }}">
  <title>Work — just enough ai</title>
</head>
<body>
  <p>Redirecting to <a href="{{ target }}">our work</a>.</p>
  <script>window.location.replace({{ target | jsonify }});</script>
</body>
</html>
